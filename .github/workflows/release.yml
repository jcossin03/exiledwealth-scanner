# A tag vX.Y.Z builds the app from that commit and publishes the files as a zip on
# a GitHub release, with a signed build provenance attestation. The release script
# (in the private site repo) downloads this zip, checks the attestation, then packs
# it with Velopack and signs the update feed: the exe players get is this build.
# Our own files carry the attestation too, so an installed copy can be checked directly. Run by hand (workflow_dispatch) it is a dry run: the same
# build, attestations and launch check, kept as a workflow artifact, no release.
# No release without a launch: the built zip is started on Windows first (smoke), so a build that
# dies on start (0.4.7 to 0.4.10) never reaches the release script or a player.
# Tokens that can write never meet build code: build runs restore, tests and publish (package code)
# read-only; attest and release only download the zip, and run no dotnet. Packages are pinned by the
# committed packages.lock.json files (Directory.Build.props: a locked restore in CI).
name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Tag matches the app version
        id: version
        run: |
          v="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' EwCapture/EwCapture.csproj)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but <Version> $v"; exit 1; }
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: >
          dotnet test EwCapture.Tests
          --filter "FullyQualifiedName!~RecognitionTests&FullyQualifiedName!~TabStripTests&FullyQualifiedName!~StashGateTests&FullyQualifiedName!~StripCoverTests"

      # A plain folder for win-x64 (both set in the csproj), not one single-file exe.
      - run: dotnet publish EwCapture -c Release -o publish
      # Velopack leaves these out of the installer, so they go here too: the zip holds
      # exactly the files an install gets, plus Velopack's own.
      - name: Zip
        run: |
          test -f publish/ew-capture.exe
          rm -f publish/*.pdb publish/createdump.exe
          (cd publish && zip -qrX "../ew-capture-$VERSION-win-x64.zip" .)
          sha256sum "ew-capture-$VERSION-win-x64.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ew-capture-${{ env.VERSION }}-win-x64
          path: ew-capture-${{ env.VERSION }}-win-x64.zip

  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ew-capture-${{ env.VERSION }}-win-x64
      # The exact zip the release will carry, unpacked the way an install holds it.
      - run: |
          Expand-Archive "ew-capture-$env:VERSION-win-x64.zip" app
          .github/smoke.ps1 -AppDir app
        shell: pwsh

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write      # the attestation's signing identity
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ew-capture-${{ env.VERSION }}-win-x64
      # Our own files are attested too, so an installed copy can be checked directly.
      - run: unzip -q "ew-capture-$VERSION-win-x64.zip" ew-capture.exe ew-capture.dll EwCapture.Core.dll -d publish
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ew-capture-${{ env.VERSION }}-win-x64.zip
            publish/ew-capture.exe
            publish/ew-capture.dll
            publish/EwCapture.Core.dll

  release:
    needs: [build, smoke, attest]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # the GitHub release
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ew-capture-${{ env.VERSION }}-win-x64

      # The notes are the tag's message (git tag -a, from the site's changelog entry).
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          obj="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq 'select(.object.type == "tag") | .object.sha')"
          [ -n "$obj" ] || { echo "v$VERSION is not an annotated tag: its message is the release notes"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj" --jq .message | sed '/^-----BEGIN/,$d' > notes.md
          printf '\n---\nBuilt by [this workflow](%s) from %s. Install from https://exiledwealth.com/app/scanner; it updates itself. [Check your install](https://github.com/%s#check-your-install).\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REPOSITORY" >> notes.md
          gh release create "$GITHUB_REF_NAME" "ew-capture-$VERSION-win-x64.zip" \
            --title "Exiled Wealth scanner $VERSION" --notes-file notes.md
